<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaudhry Usama Waheed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  :root {
    --bg: #f3f1ec;
    --fg: #1d2a44;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14182a; --fg: #eae6da; }
  }
  :root[data-theme="dark"] { --bg: #14182a; --fg: #eae6da; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    margin: 0;
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: clamp(2rem, 7.5vw, 8rem);
    letter-spacing: -0.03em;
    line-height: 1;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Chaudhry Usama Waheed</h1>
</body>
</html>
